<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 公众号排版转换器 - 极简商务模板</title>
    <!-- 加载 Tailwind CSS 用于美化界面 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* [CSS Styles are Identical to previous steps] */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 1200px;
        }
        textarea {
            resize: none;
            height: 500px;
        }
        #previewFrame {
            width: 100%;
            height: 500px;
            border: 1px solid #cbd5e1;
            background-color: white;
            border-radius: 0.5rem;
        }
        .loading-ring {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2563EB;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 复制按钮样式 */
        .copy-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background-color: #374151;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .copy-btn:hover {
            background-color: #4B5563;
            transform: translateY(-1px);
        }
        .copy-btn:active {
            background-color: #1F2937;
            transform: translateY(0);
        }
        .copy-btn.copied {
            background-color: #10B981;
        }
        .copy-btn.copied::after {
            content: "✓ 已复制";
        }
        .copy-btn.copied svg {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container space-y-8">
        <header class="text-center">
            <h1 class="text-4xl font-bold text-gray-800">AI 公众号 HTML 排版引擎 - 极简商务模板</h1>
            <p class="text-gray-500 mt-2">极简主义商务风格排版系统。</p>
        </header>

        <main class="grid lg:grid-cols-2 gap-6">
            <div class="flex flex-col h-full gap-4">
                <!-- 上侧板块：内容输入区 -->
                <div class="flex flex-col h-1/2 relative">
                    <div class="flex justify-between items-center mb-2">
                        <label for="inputContent" class="block text-lg font-medium text-gray-700">1. 输入内容</label>
                        <button id="convertBtn" class="px-4 py-2 border border-blue-500 text-sm font-medium rounded-lg text-white bg-blue-600 hover:bg-blue-700 transition duration-150">
                            <span id="buttonText">AI 转换为 HTML 排版</span>
                        </button>
                    </div>
                    <textarea id="inputContent" class="w-full p-4 border border-gray-300 rounded-lg shadow-inner focus:ring-blue-500 focus:border-blue-500 transition duration-150 flex-grow" placeholder="粘贴您的文章内容..." rows="10">这是一个完整的文章内容，请确保文章头部增加引用样式的简短摘要。</textarea>
                </div>
                
                <!-- 下侧板块：Markdown编辑区 -->
                <div class="flex flex-col h-1/2 relative">
                    <div class="flex justify-between items-center mb-2">
                        <label for="markdownContent" class="block text-lg font-medium text-gray-700">2. Markdown 编辑区</label>
                        <button class="copy-btn" data-target="markdownContent">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                            复制
                        </button>
                    </div>
                    <textarea id="markdownContent" class="w-full p-4 border border-gray-300 rounded-lg shadow-inner focus:ring-green-500 focus:border-green-500 transition duration-150 flex-grow" placeholder="AI 生成的 Markdown 格式文本将显示在这里，支持手动编辑..." rows="10"></textarea>
                </div>
            </div>

            <div class="flex flex-col h-full gap-4">
                <!-- 右侧上板块：实时HTML代码预览 -->
                <div class="flex flex-col h-1/2 relative">
                    <div class="flex justify-between items-center mb-2">
                        <label for="outputHtml" class="block text-lg font-medium text-gray-700">3. 实时 HTML 代码预览</label>
                        <button class="copy-btn" data-target="outputHtml">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                            复制
                        </button>
                    </div>
                    <textarea id="outputHtml" readonly class="w-full p-4 border border-gray-300 rounded-lg shadow-inner bg-gray-50 flex-grow" placeholder="左侧 Markdown 编辑区的内容将实时转换为 HTML 代码显示在这里..." rows="10"></textarea>
                </div>
                
                <!-- 右侧下板块：实时视觉效果预览 -->
                <div class="flex flex-col h-1/2 relative">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-lg font-medium text-gray-700">4. 实时视觉效果预览</span>
                        <button class="copy-btn" data-target="preview">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                            复制
                        </button>
                    </div>
                    <div id="previewWrapper" class="p-4 border-2 border-dashed border-blue-300 rounded-lg bg-white overflow-y-scroll flex-grow">
                        <iframe id="previewFrame" title="HTML Preview" sandbox="allow-scripts allow-same-origin" class="w-full h-full"></iframe>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const apiKey = "sk-evnzwlkcztarigsagfktigefdzpqevgnggednvkgbbewsttn"; // 硅基流动API Key 

        const inputContent = document.getElementById('inputContent');
        const outputHtml = document.getElementById('outputHtml');
        const convertBtn = document.getElementById('convertBtn');
        const buttonText = document.getElementById('buttonText');
        const previewFrame = document.getElementById('previewFrame');
        const markdownContent = document.getElementById('markdownContent');
        const copyMarkdownBtn = document.getElementById('copyMarkdownBtn');
        const copyPreviewBtn = document.getElementById('copyPreviewBtn');
        
        // 防抖函数，避免频繁触发实时联动
        let debounceTimer;
        function debounce(func, delay) {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(func, delay);
        }

        // 🌐 AI公众号排版与内容专家（极简商务模板）
        const SYSTEM_INSTRUCTION = `
            🔷 核心使命与角色
            你是一位精通极简主义和商务排版的专家。核心职责是：根据用户输入和结构重塑规则，同时生成内容对应的 Markdown 结构文本和微信兼容 HTML 代码。
            
            内容模式判断：
            
            如果输入是简短话题或主题（少于 100 字）：进入内容创作模式（生成 800-1200 字文章）。
            
            如果输入是完整但无结构的文章内容（超过 100 字且缺乏标题）：进入结构重塑模式，强制应用正式文章结构。
            
            如果输入是结构完整的文章：进入排版优化模式（优化分段并应用样式）。
            
            强制双格式输出：你的最终输出必须且只能包含两个部分，用指定的标记分隔。
            
            📝 内容结构与极简商务规范
            结构重塑强制规则（针对无标题/无结构文本）：
            如果输入的文本缺乏结构：
            
            自动生成主标题 (H1)：AI 必须根据文本核心主题，自动提炼并生成一个沉稳、专业的 H1 级别文章标题。
            
            强制分段：将内容拆解为以下正式结构：引言 (H2, 编号 1.)、核心论点/主体 (H2/H3, 编号 2.)、结论与展望 (H2, 下一序号)。
            
            结构编号规则：在文章主体部分，对 H2 和 H3 级别的标题必须进行分级编号（例如：H2为 "1. XXXXX", H3为 "1.1 XXXX"）。
            
            🎨 核心色彩规范
            主色调 (Primary)：沉稳商务灰蓝 #374151。
            
            背景色：纯白色 #FFFFFF，容器背景使用最浅灰 #F9FAFB。
            
            📐 核心排版与组件执行
            硬约束：所有样式必须写在 'style=""' 中，绝不使用 'class'、'id'、'<style>'。
            
            标签优化：优先使用 <section> 和 <p> 作为容器。
            
            样式规范：圆角 4px，模块分隔依赖垂直留白和细致的浅灰色分割线。
            
            📢 最终输出格式（这是强制规则）
            你的响应内容必须且仅包含以下结构。请将所有生成的 Markdown 和 HTML 内容分别放置在对应的标记块中。
            
            <--- MARKDOWN_START --->
            
            [AI 自动生成/提炼的文章主标题]
            [引用样式的简短摘要或分享语]
            
            1. [引言/背景 H2 标题]
            ... [对应的正文内容]
            
            1.1 [H3 标题]
            ... [对应的正文内容]
            
            2. [核心论点 H2 标题]
            ... [对应的正文内容]
            <--- MARKDOWN_END --->
            
            <--- HTML_START --->
            [完整的微信兼容 HTML 代码片段]
            <--- HTML_END --->
        `;

        // --- API 和辅助函数保持不变 ---

        async function fetchWithRetry(url, options, maxRetries = 5) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) {
                        if (response.status >= 500) {
                            throw new Error(`Server error: ${response.status}`);
                        }
                        const errorBody = await response.json();
                        throw new Error(`Client error: ${response.status} - ${JSON.stringify(errorBody)}`);
                    }
                    return response;
                } catch (error) {
                    console.error(`Attempt ${i + 1} failed:`, error.message);
                    if (i === maxRetries - 1) throw error;
                    const delay = Math.pow(2, i) * 1000 + Math.random() * 1000;
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
            }
        }

        async function convertToHtml() {
            const userQuery = inputContent.value.trim();
            if (!userQuery) {
                showTemporaryMessage("请输入内容后再进行转换。", 'red');
                return;
            }

            convertBtn.disabled = true;
            buttonText.innerHTML = '<div class="loading-ring"></div> AI 正在排版中...';
            outputHtml.value = '';
            previewFrame.srcdoc = '<div style="padding: 20px; color: #64748B;">AI 正在生成排版...</div>';

            const apiUrl = "https://api.siliconflow.cn/v1/chat/completions";

            const payload = {
                model: "deepseek-ai/DeepSeek-R1",
                messages: [
                    {
                        role: "system",
                        content: SYSTEM_INSTRUCTION
                    },
                    {
                        role: "user", 
                        content: userQuery
                    }
                ],
                temperature: 0.7,
                max_tokens: 8192,
                stream: false
            };

            try {
                const response = await fetchWithRetry(apiUrl, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                let generatedContent = result?.choices?.[0]?.message?.content || '生成失败，请检查 API 响应。';
                
                // 解析双格式输出
                const { generatedMarkdown, generatedHtml } = parseDualFormatOutput(generatedContent);
                
                // 验证并修复Markdown格式
                const validatedMarkdown = validateAndFixMarkdownFormat(generatedMarkdown);
                markdownContent.value = validatedMarkdown;
                
                // 更新HTML预览
                outputHtml.value = generatedHtml;
                
                // 更新实时预览
                updateRealTimePreview();

            } catch (error) {
                console.error("API 调用失败:", error);
                outputHtml.value = "排版生成失败，请检查网络或 API Key 配置。\n错误信息: " + error.message;
                // 修复语法错误：替换为标准字符串拼接
                previewFrame.srcdoc = '<div style="padding: 20px; color: red;">排版失败: ' + error.message + '</div>';
            } finally {
                convertBtn.disabled = false;
                buttonText.innerHTML = 'AI 转换为 HTML 排版';
            }
        }

        // 解析双格式输出
        function parseDualFormatOutput(content) {
            const markdownStart = content.indexOf('<--- MARKDOWN_START --->');
            const markdownEnd = content.indexOf('<--- MARKDOWN_END --->');
            const htmlStart = content.indexOf('<--- HTML_START --->');
            const htmlEnd = content.indexOf('<--- HTML_END --->');
            
            let generatedMarkdown = '';
            let generatedHtml = '';
            
            // 提取Markdown内容
            if (markdownStart !== -1 && markdownEnd !== -1 && markdownEnd > markdownStart) {
                generatedMarkdown = content.substring(markdownStart + '<--- MARKDOWN_START --->'.length, markdownEnd).trim();
            } else {
                // 备用方案：如果没有找到标记，尝试提取HTML代码块
                const htmlMatch = content.match(/```html\n?([\s\S]*?)\n?```/);
                if (htmlMatch) {
                    generatedHtml = htmlMatch[1].trim();
                    // 从原始内容中提取Markdown（去除HTML代码块）
                    generatedMarkdown = content.replace(/```html[\s\S]*?```/g, '').trim();
                } else {
                    // 最终备用方案：使用原始内容作为Markdown
                    generatedMarkdown = content.trim();
                    generatedHtml = content.trim();
                }
            }
            
            // 提取HTML内容
            if (htmlStart !== -1 && htmlEnd !== -1 && htmlEnd > htmlStart) {
                generatedHtml = content.substring(htmlStart + '<--- HTML_START --->'.length, htmlEnd).trim();
            }
            
            // 清理HTML代码
            generatedHtml = generatedHtml.replace(/```html\n?|```/g, '').trim();
            
            return { generatedMarkdown, generatedHtml };
        }

        // Markdown格式验证与修复函数
        function validateAndFixMarkdownFormat(markdown) {
            if (!markdown || markdown.trim() === '') return markdown;
            
            let fixedMarkdown = markdown;
            
            // 1. 修复标题格式：确保使用#、##、###标记
            fixedMarkdown = fixedMarkdown.replace(/^(\d+\.\s*)(.+)$/gm, (match, numbering, title) => {
                // 判断标题级别
                if (numbering.includes('.')) {
                    const dotCount = (numbering.match(/\./g) || []).length;
                    if (dotCount === 1) return `## ${title}`;
                    if (dotCount === 2) return `### ${title}`;
                }
                return match;
            });
            
            // 2. 确保主标题使用#标记
            if (!fixedMarkdown.startsWith('# ') && !fixedMarkdown.startsWith('## ') && !fixedMarkdown.startsWith('### ')) {
                const lines = fixedMarkdown.split('\n');
                if (lines.length > 0 && lines[0].trim()) {
                    lines[0] = `# ${lines[0].trim()}`;
                    fixedMarkdown = lines.join('\n');
                }
            }
            
            // 3. 修复引用块格式
            fixedMarkdown = fixedMarkdown.replace(/^>\s*(.+)$/gm, '> $1');
            
            // 4. 修复列表格式
            fixedMarkdown = fixedMarkdown.replace(/^[-*]\s*(.+)$/gm, '- $1');
            
            // 5. 确保段落之间有适当的分隔
            fixedMarkdown = fixedMarkdown.replace(/\n{3,}/g, '\n\n');
            
            // 6. 移除多余的空格
            fixedMarkdown = fixedMarkdown.replace(/ +/g, ' ').replace(/\n +/g, '\n');
            
            // 7. 确保结构完整性
            const lines = fixedMarkdown.split('\n');
            let hasH1 = false;
            let hasH2 = false;
            
            for (let i = 0; i < lines.length; i++) {
                if (lines[i].startsWith('# ') && !lines[i].startsWith('## ') && !lines[i].startsWith('### ')) {
                    hasH1 = true;
                }
                if (lines[i].startsWith('## ')) {
                    hasH2 = true;
                }
            }
            
            // 8. 如果没有H1标题，添加一个
            if (!hasH1 && lines.length > 0 && lines[0].trim()) {
                lines[0] = `# ${lines[0].trim()}`;
                fixedMarkdown = lines.join('\n');
            }
            
            // 9. 确保引用摘要格式
            if (!fixedMarkdown.includes('> ') && lines.length > 1) {
                for (let i = 1; i < Math.min(3, lines.length); i++) {
                    if (lines[i].trim() && !lines[i].startsWith('#') && !lines[i].startsWith('-')) {
                        lines[i] = `> ${lines[i].trim()}`;
                        break;
                    }
                }
                fixedMarkdown = lines.join('\n');
            }
            
            return fixedMarkdown;
        }

        function showTemporaryMessage(message, color) {
            const tempSpan = document.createElement('span');
            tempSpan.textContent = message;
            // 修复语法错误：确保 className 的模板字符串没有额外的反斜杠
            tempSpan.className = `text-${color}-600 font-semibold absolute top-0 right-0 p-2 bg-${color}-100 rounded-lg shadow-md`;
            
            const container = document.querySelector('.container');
            container.style.position = 'relative';
            container.appendChild(tempSpan);

            setTimeout(() => {
                container.removeChild(tempSpan);
            }, 3000);
        }

        // Markdown到HTML的实时转换函数
        function markdownToHtml(markdown) {
            return markdown
                .replace(/^### (.*$)/gm, '<h3 style="color: #D97706; font-weight: 500; font-size: 16px; margin: 20px 0 12px 0;">$1</h3>')
                .replace(/^## (.*$)/gm, '<h2 style="color: #1E40AF; font-weight: 600; font-size: 18px; margin: 24px 0 16px 0;">$1</h2>')
                .replace(/^# (.*$)/gm, '<h1 style="color: #1E40AF; font-weight: 600; font-size: 22px; text-align: left; margin-bottom: 8px;">$1</h1>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/`(.*?)`/g, '<code style="background: #F8FAFC; padding: 2px 4px; border-radius: 2px; font-family: monospace;">$1</code>')
                .replace(/^- (.*$)/gm, '<li style="margin: 8px 0; line-height: 1.6;">$1</li>')
                .replace(/^\d+\. (.*$)/gm, '<li style="margin: 8px 0; line-height: 1.6;">$1</li>')
                .replace(/\n\n/g, '</p><p style="line-height: 1.6; color: #374151; font-size: 16px; margin: 18px 0;">')
                .replace(/^>/gm, '<blockquote style="background: #EFF6FF; border-left: 4px solid #1E40AF; padding: 16px 20px; margin: 16px 0;">')
                .replace(/\n/g, '<br>');
        }

        // 实时更新预览
        function updateRealTimePreview() {
            const markdownText = markdownContent.value;
            if (markdownText.trim()) {
                const htmlContent = markdownToHtml(markdownText);
                const fullHtml = '<!DOCTYPE html>' + 
                    '<html>' +
                    '<head>' +
                    '    <meta charset="UTF-8">' +
                    '    <meta name="viewport" content="width=device-width, initial-scale=1.0">' +
                    '    <title>Preview</title>' +
                    '    <style>' +
                    '        body {' +
                    '            margin: 0 auto; ' +
                    '            max-width: 680px; ' +
                    '            padding: 20px;' +
                    '            box-sizing: border-box;' +
                    '            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;' +
                    '            line-height: 1.6; ' +
                    '            background-color: white;' +
                    '        }' +
                    '        p { line-height: 1.6; color: #374151; font-size: 16px; margin: 18px 0; }' +
                    '        h1 { color: #1E40AF; font-weight: 600; font-size: 22px; text-align: left; margin-bottom: 8px; }' +
                    '        h2 { color: #1E40AF; font-weight: 600; font-size: 18px; margin: 24px 0 16px 0; }' +
                    '        h3 { color: #D97706; font-weight: 500; font-size: 16px; margin: 20px 0 12px 0; }' +
                    '        blockquote { background: #EFF6FF; border-left: 4px solid #1E40AF; padding: 16px 20px; margin: 16px 0; }' +
                    '        ul, ol { margin-left: 24px; line-height: 1.6; }' +
                    '    </style>' +
                    '</head>' +
                    '<body>' +
                    htmlContent +
                    '</body>' +
                    '</html>';
                previewFrame.srcdoc = fullHtml;
                outputHtml.value = htmlContent;
            }
        }

        // 复制Markdown内容
        function copyMarkdownToClipboard() {
            markdownContent.select();
            document.execCommand('copy');
            const originalText = copyMarkdownBtn.textContent;
            copyMarkdownBtn.textContent = '已复制！';
            setTimeout(() => {
                copyMarkdownBtn.textContent = originalText;
            }, 1500);
        }

        // 复制预览内容
        function copyPreviewToClipboard() {
            const originalText = copyPreviewBtn.textContent;
            
            try {
                const previewFrame = document.getElementById('previewFrame');
                const iframeDoc = previewFrame.contentDocument || previewFrame.contentWindow.document;
                const previewBody = iframeDoc.body;
                
                if (!previewBody || previewBody.innerHTML.includes('AI 正在生成排版') || previewBody.innerHTML.includes('排版失败')) {
                    showTemporaryMessage('请先生成有效的预览内容', 'red');
                    return;
                }
                
                const tempTextarea = document.createElement('textarea');
                tempTextarea.value = previewBody.innerText || previewBody.textContent;
                document.body.appendChild(tempTextarea);
                tempTextarea.select();
                document.execCommand('copy');
                document.body.removeChild(tempTextarea);
                
                copyPreviewBtn.textContent = '已复制！';
                showTemporaryMessage('预览内容已复制到剪贴板', 'green');
                
                setTimeout(() => {
                    copyPreviewBtn.textContent = originalText;
                }, 2000);
                
            } catch (error) {
                console.error('复制失败:', error);
                showTemporaryMessage('复制失败，请手动复制预览内容', 'red');
                copyPreviewBtn.textContent = originalText;
            }
        }

        // 复制到剪贴板核心函数
        async function copyToClipboard(target, event) {
            const copyBtn = event.target.closest('.copy-btn');
            if (!copyBtn) return;
            
            try {
                let content = '';
                let isRichText = false;
                
                switch (target) {
                    case 'markdownContent':
                        content = markdownContent.value;
                        if (!content.trim()) {
                            showTemporaryMessage('Markdown内容为空，请先生成内容', 'red');
                            return;
                        }
                        break;
                        
                    case 'outputHtml':
                        content = outputHtml.value;
                        if (!content.trim()) {
                            showTemporaryMessage('HTML内容为空，请先生成内容', 'red');
                            return;
                        }
                        break;
                        
                    case 'preview':
                        const previewFrame = document.getElementById('previewFrame');
                        const iframeDoc = previewFrame.contentDocument || previewFrame.contentWindow.document;
                        const previewBody = iframeDoc.body;
                        
                        if (!previewBody || previewBody.innerHTML.includes('AI 正在生成排版') || previewBody.innerHTML.includes('排版失败')) {
                            showTemporaryMessage('请先生成有效的预览内容', 'red');
                            return;
                        }
                        
                        // 获取预览内容的完整HTML（包括样式）
                        const previewHtml = iframeDoc.documentElement.outerHTML;
                        content = previewHtml;
                        isRichText = true;
                        break;
                }
                
                if (isRichText) {
                    // 富文本复制（保持格式）
                    const blob = new Blob([content], { type: 'text/html' });
                    const textBlob = new Blob([content.replace(/<[^>]*>/g, '')], { type: 'text/plain' });
                    
                    const clipboardItem = new ClipboardItem({
                        'text/html': blob,
                        'text/plain': textBlob
                    });
                    
                    await navigator.clipboard.write([clipboardItem]);
                } else {
                    // 纯文本复制
                    await navigator.clipboard.writeText(content);
                }
                
                // 显示复制成功状态
                copyBtn.classList.add('copied');
                showTemporaryMessage('内容已复制到剪贴板', 'green');
                
                setTimeout(() => {
                    copyBtn.classList.remove('copied');
                }, 2000);
                
            } catch (error) {
                console.error('复制失败:', error);
                
                // 降级方案：使用传统方法
                try {
                    let content = '';
                    
                    switch (target) {
                        case 'markdownContent':
                            content = markdownContent.value;
                            break;
                        case 'outputHtml':
                            content = outputHtml.value;
                            break;
                        case 'preview':
                            const previewFrame = document.getElementById('previewFrame');
                            const iframeDoc = previewFrame.contentDocument || previewFrame.contentWindow.document;
                            const previewBody = iframeDoc.body;
                            content = previewBody.innerText || previewBody.textContent;
                            break;
                    }
                    
                    const tempTextarea = document.createElement('textarea');
                    tempTextarea.value = content;
                    document.body.appendChild(tempTextarea);
                    tempTextarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(tempTextarea);
                    
                    copyBtn.classList.add('copied');
                    showTemporaryMessage('文本内容已复制（样式可能不完整）', 'yellow');
                    
                    setTimeout(() => {
                        copyBtn.classList.remove('copied');
                    }, 2000);
                    
                } catch (fallbackError) {
                    showTemporaryMessage('复制失败，请手动复制内容', 'red');
                }
            }
        }

        // 事件监听器
        convertBtn.addEventListener('click', convertToHtml);
        
        // 为所有复制按钮添加事件监听
        document.addEventListener('click', function(event) {
            if (event.target.closest('.copy-btn')) {
                const target = event.target.closest('.copy-btn').getAttribute('data-target');
                copyToClipboard(target, event);
            }
        });
        
        // Markdown编辑区实时联动
        markdownContent.addEventListener('input', () => {
            debounce(updateRealTimePreview, 300);
        });



        async function copyPreviewContent() {
            const copyStyleBtn = document.getElementById('copyStyleBtn');

            try {

                const previewFrame = document.getElementById('previewFrame');
                const iframeDoc = previewFrame.contentDocument || previewFrame.contentWindow.document;
                
                // 获取预览区域的body内容
                const previewBody = iframeDoc.body;
                
                if (!previewBody || previewBody.innerHTML.includes('AI 正在生成排版') || previewBody.innerHTML.includes('排版失败')) {
                    showTemporaryMessage('请先生成有效的预览内容', 'red');
                    return;
                }
                
                // 创建微信公众号兼容的HTML内容
                const wechatHtml = createWeChatCompatibleHtml(previewBody.innerHTML);
                
                // 创建一个临时div来复制富文本内容
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = wechatHtml;
                
                // 创建一个临时textarea来复制文本内容
                const tempTextarea = document.createElement('textarea');
                tempTextarea.value = tempDiv.innerText || tempDiv.textContent;
                document.body.appendChild(tempTextarea);
                tempTextarea.select();
                
                // 使用Clipboard API复制富文本
                const blob = new Blob([wechatHtml], { type: 'text/html' });
                const textBlob = new Blob([tempTextarea.value], { type: 'text/plain' });
                
                const clipboardItem = new ClipboardItem({
                    'text/html': blob,
                    'text/plain': textBlob
                });
                
                await navigator.clipboard.write([clipboardItem]);
                
                // 清理临时元素
                document.body.removeChild(tempTextarea);
                
                // 显示成功提示
                copyStyleBtn.textContent = '样式已复制！';
                showTemporaryMessage('预览内容已复制到剪贴板，可直接粘贴到微信公众号编辑器', 'green');
                
                setTimeout(() => {
                    copyStyleBtn.innerHTML = originalText;
                }, 2000);
                
            } catch (error) {
                console.error('复制失败:', error);
                
                // 降级方案：使用传统方法复制文本内容
                try {
                    const previewFrame = document.getElementById('previewFrame');
                    const iframeDoc = previewFrame.contentDocument || previewFrame.contentWindow.document;
                    const previewBody = iframeDoc.body;
                    
                    const tempTextarea = document.createElement('textarea');
                    tempTextarea.value = previewBody.innerText || previewBody.textContent;
                    document.body.appendChild(tempTextarea);
                    tempTextarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(tempTextarea);
                    
                    copyStyleBtn.textContent = '文本已复制！';
                    showTemporaryMessage('文本内容已复制（样式可能不完整）', 'yellow');
                    
                    setTimeout(() => {
                        copyStyleBtn.innerHTML = originalText;
                    }, 2000);
                } catch (fallbackError) {
                    showTemporaryMessage('复制失败，请手动复制预览内容', 'red');
                    copyStyleBtn.innerHTML = originalText;
                }
            }
        }
