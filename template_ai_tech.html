<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 公众号排版转换器 (最终版)</title>
    <!-- 加载 Tailwind CSS 用于美化界面 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* [CSS Styles are Identical to previous steps] */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }
        
        .copy-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            background-color: #3B82F6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .copy-btn:hover {
            background-color: #2563EB;
            transform: translateY(-1px);
        }
        
        .copy-btn:active {
            transform: translateY(0);
        }
        
        .copy-btn.copied {
            background-color: #10B981;
        }
        
        .copy-btn.copied::after {
            content: '✓ 已复制';
        }
        .container {
            width: 100%;
            max-width: 1200px;
        }
        textarea {
            resize: none;
        }
        #previewFrame {
            width: 100%;
            height: 100%;
            border: 1px solid #cbd5e1;
            background-color: white;
            border-radius: 0.5rem;
        }
        .loading-ring {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2563EB;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .h-1\/2 {
            height: 50%;
        }
        #markdownContent {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
        }
        textarea {
            min-height: 200px;
        }
    </style>
</head>
<body>
    <div class="container space-y-8">
        <header class="text-center">
            <h1 class="text-4xl font-bold text-gray-800">AI 公众号 HTML 排版引擎 - AI科技模板</h1>
            <p class="text-gray-500 mt-2">专为AI技术内容设计的科技感排版系统。</p>
        </header>

        <main class="grid lg:grid-cols-2 gap-6 h-[calc(100vh-200px)]">
            <!-- 左侧：输入区 -->
            <div class="flex flex-col gap-6 h-full">
                <div class="flex flex-col h-1/2">
                    <div class="flex justify-between items-center mb-2">
                        <label for="inputContent" class="block text-lg font-medium text-gray-700">1. 输入内容</label>
                        <button id="convertBtn" class="px-4 py-2 border border-blue-500 text-sm font-medium rounded-lg text-white bg-blue-600 hover:bg-blue-700 transition duration-150">
                            <span id="buttonText">AI转换</span>
                        </button>
                    </div>
                    <textarea id="inputContent" class="w-full h-full p-4 border border-gray-300 rounded-lg shadow-inner focus:ring-blue-500 focus:border-blue-500 transition duration-150" placeholder="粘贴您的文章内容...">这是一个完整的文章内容，请确保文章头部增加引用样式的简短摘要。</textarea>
                </div>
                
                <div class="flex flex-col h-1/2 relative">
                    <div class="flex justify-between items-center mb-2">
                        <label for="markdownContent" class="block text-lg font-medium text-gray-700">2. Markdown编辑区</label>
                        <button id="copyMarkdownBtn" class="copy-btn" title="复制Markdown内容">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                            </svg>
                            复制
                        </button>
                    </div>
                    <textarea id="markdownContent" class="w-full h-full p-4 border border-gray-300 rounded-lg shadow-inner bg-gray-50" placeholder="AI生成的Markdown格式文本将显示在这里..."></textarea>
                </div>
            </div>

            <!-- 右侧：预览区 -->
            <div class="flex flex-col gap-6 h-full">
                <div class="flex flex-col h-1/2 relative">
                    <div class="flex justify-between items-center mb-2">
                        <label for="outputHtml" class="block text-lg font-medium text-gray-700">3. HTML代码预览</label>
                        <button id="copyHtmlBtn" class="copy-btn" title="复制HTML代码">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                            </svg>
                            复制
                        </button>
                    </div>
                    <textarea id="outputHtml" readonly class="w-full h-full p-4 border border-gray-300 rounded-lg shadow-inner bg-gray-50" placeholder="AI生成的HTML代码将显示在这里..."></textarea>
                </div>
                
                <div class="flex flex-col h-1/2 relative">
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-lg font-medium text-gray-700">4. 视觉效果预览</label>
                        <button id="copyPreviewBtn" class="copy-btn" title="复制预览内容">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                            </svg>
                            复制
                        </button>
                    </div>
                    <div id="previewWrapper" class="w-full h-full p-4 border-2 border-dashed border-blue-300 rounded-lg bg-white">
                        <iframe id="previewFrame" title="HTML Preview" sandbox="allow-scripts allow-same-origin" class="w-full h-full"></iframe>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const apiKey = "sk-evnzwlkcztarigsagfktigefdzpqevgnggednvkgbbewsttn"; // 硅基流动API Key 

        const inputContent = document.getElementById('inputContent');
        const outputHtml = document.getElementById('outputHtml');
        const convertBtn = document.getElementById('convertBtn');
        const buttonText = document.getElementById('buttonText');
        const previewFrame = document.getElementById('previewFrame');
        const markdownContent = document.getElementById('markdownContent');

        // 🌐 AI公众号排版与内容专家（AI科技模板）
        const SYSTEM_INSTRUCTION = `🌐 AI公众号排版与内容专家（AI科技模板）

🔷 核心使命与角色
你是一位精通微信前端限制和未来科技美学的专家。核心职责是：根据用户输入和结构重塑规则，同时生成内容对应的 Markdown 结构文本和微信兼容 HTML 代码。

内容模式判断：

如果输入是简短话题或主题（少于 100 字）：进入内容创作模式（生成 800-1200 字文章）。

如果输入是完整但无结构的文章内容（超过 100 字且缺乏标题）：进入结构重塑模式，强制应用正式文章结构。

如果输入是结构完整的文章：进入排版优化模式（优化分段并应用样式）。

强制双格式输出：你的最终输出必须且只能包含两个部分，用指定的标记分隔。

📝 内容结构与AI科技规范
结构重塑强制规则（针对无标题/无结构文本）：
如果输入的文本缺乏结构：

自动生成主标题 (H1)：AI 必须根据文本核心主题，自动提炼并生成一个沉稳、专业的 H1 级别文章标题。

强制分段：将内容拆解为以下正式结构：引言 (H2, 编号 1.)、核心论点/主体 (H2/H3, 编号 2.)、结论与展望 (H2, 下一序号)。

结构编号规则：在文章主体部分，对 H2 和 H3 级别的标题必须进行分级编号（例如：H2为 "1. XXXXX", H3为 "1.1 XXXX"）。

🎨 核心色彩规范
主色调 (Primary)：深邃科技蓝 #3B82F6。

背景色：纯白 #FFFFFF，容器背景使用浅灰色 #F8FAFC。

📐 核心排版与组件执行
硬约束：所有样式必须写在 'style=""' 中，绝不使用 'class'、'id'、'<style>'。

标签优化：优先使用 <section> 和 <p> 作为容器。

样式规范：圆角 8px，引用块左侧使用主色调 4px 竖条。

📢 最终输出格式（这是强制规则）
你的响应内容必须且仅包含以下结构。请将所有生成的 Markdown 和 HTML 内容分别放置在对应的标记块中。

<--- MARKDOWN_START --->

# [AI 自动生成/提炼的文章主标题]
> [引用样式的简短摘要或分享语]

## 1. [引言/背景 H2 标题]
... [对应的正文内容]

### 1.1 [H3 标题]
... [对应的正文内容]

## 2. [核心论点 H2 标题]
... [对应的正文内容]
<--- MARKDOWN_END --->

<--- HTML_START --->
[完整的微信兼容 HTML 代码片段]
<--- HTML_END --->

**硬约束**：
1. 所有样式必须使用内联style属性实现，禁止使用class、id、<style>标签
2. 确保所有文本与背景的对比度符合WCAG AA标准
3. 输出必须是纯HTML代码，无任何JavaScript
4. 完全兼容微信公众号编辑器限制
5. 绝对禁止在输出内容中添加任何说明性文字、设计描述、技术说明等非内容文本

**文章底部固定内容**：
在文章正文结束后，添加以下固定模块（使用迷你卡片设计）：

1. **关注作者模块**：
   - 标题："关注作者"
   - 内容：欢迎关注"召哥AI笔记室"，获取更多AI技术干货
   - 样式：迷你卡片设计，背景 #F1F5F9，主色调按钮

2. **互动引导模块**：
   - 标题："一键三连"
   - 内容：点赞、在看、转发，支持作者创作更多优质内容
   - 样式：迷你卡片设计，背景 #F1F5F9，辅助色按钮

3. **打赏支持模块**：
   - 标题："钟意作者"
   - 内容：如果觉得文章有帮助，欢迎打赏支持
   - 样式：迷你卡片设计，背景 #F1F5F9，主色调按钮

4. **公众号链接模块**：
   - 标题："公众号链接"
   - 内容：点击访问"召哥AI笔记室"公众号主页
   - 样式：迷你卡片设计，背景 #F1F5F9，辅助色按钮
`;

        // Markdown格式验证和修复函数
        function validateAndFixMarkdownFormat(markdownText) {
            if (!markdownText) return markdownText;
            
            let fixedMarkdown = markdownText;
            
            // 1. 确保标题有正确的#标记
            // 修复H1标题（主标题）
            fixedMarkdown = fixedMarkdown.replace(/^(?!\s*#)(.+)$/gm, (match, title) => {
                // 如果是主标题且没有#标记，添加#
                if (title.trim() && !title.includes('##') && !title.includes('###')) {
                    return `# ${title.trim()}`;
                }
                return match;
            });
            
            // 2. 修复H2标题（二级标题）
            fixedMarkdown = fixedMarkdown.replace(/^(\d+\.\s+.+)$/gm, '## $1');
            
            // 3. 修复H3标题（三级标题）
            fixedMarkdown = fixedMarkdown.replace(/^(\d+\.\d+\s+.+)$/gm, '### $1');
            
            // 4. 确保引用块有>标记
            fixedMarkdown = fixedMarkdown.replace(/^\s*(>.+)$/gm, '> $1');
            
            // 5. 添加段落分隔（确保段落之间有换行）
            fixedMarkdown = fixedMarkdown.replace(/([^\n])\n([^#\n>])/g, '$1\n\n$2');
            
            // 6. 修复列表格式
            fixedMarkdown = fixedMarkdown.replace(/^\s*[-*]\s+(.+)$/gm, '- $1');
            
            // 7. 确保代码块格式正确
            fixedMarkdown = fixedMarkdown.replace(/```(\w+)?\n([\s\S]*?)```/g, '```$1\n$2\n```');
            
            // 8. 清理多余的空行
            fixedMarkdown = fixedMarkdown.replace(/\n{3,}/g, '\n\n');
            
            // 9. 确保Markdown结构完整
            const lines = fixedMarkdown.split('\n');
            let hasH1 = false;
            let hasH2 = false;
            
            for (let i = 0; i < lines.length; i++) {
                if (lines[i].startsWith('# ') && !lines[i].startsWith('##')) {
                    hasH1 = true;
                }
                if (lines[i].startsWith('## ')) {
                    hasH2 = true;
                }
            }
            
            // 如果没有标题结构，尝试重新组织
            if (!hasH1 && lines.length > 0) {
                const firstLine = lines[0].trim();
                if (firstLine && !firstLine.startsWith('#') && !firstLine.startsWith('>')) {
                    lines[0] = `# ${firstLine}`;
                    fixedMarkdown = lines.join('\n');
                }
            }
            
            return fixedMarkdown;
        }

        // 核心转换函数 - 强制双输出结构
        async function convertToHtml() {
            const userQuery = inputContent.value.trim();
            if (!userQuery) {
                alert("请输入内容后再进行转换。");
                return;
            }

            convertBtn.disabled = true;
            buttonText.innerHTML = '<div class="loading-ring"></div> AI 正在生成双格式内容...';
            outputHtml.value = '';
            markdownContent.value = '';
            previewFrame.srcdoc = '<div style="padding: 20px; color: #64748B;">AI 正在生成双格式内容...</div>';

            const apiUrl = "https://api.siliconflow.cn/v1/chat/completions";

            const payload = {
                model: "deepseek-ai/DeepSeek-R1",
                messages: [
                    {
                        role: "system",
                        content: SYSTEM_INSTRUCTION
                    },
                    {
                        role: "user", 
                        content: userQuery
                    }
                ],
                temperature: 0.7,
                max_tokens: 8192,
                stream: false
            };

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`API调用失败: ${response.status}`);
                }

                const result = await response.json();
                let generatedContent = result?.choices?.[0]?.message?.content || '生成失败，请检查 API 响应。';
                
                // 解析强制双输出结构
                let generatedMarkdown = '';
                let generatedHtml = '';
                
                // 提取 MARKDOWN 部分
                const markdownStart = generatedContent.indexOf('<--- MARKDOWN_START --->');
                const markdownEnd = generatedContent.indexOf('<--- MARKDOWN_END --->');
                
                if (markdownStart !== -1 && markdownEnd !== -1 && markdownEnd > markdownStart) {
                    generatedMarkdown = generatedContent.substring(markdownStart + 25, markdownEnd).trim();
                }
                
                // 提取 HTML 部分
                const htmlStart = generatedContent.indexOf('<--- HTML_START --->');
                const htmlEnd = generatedContent.indexOf('<--- HTML_END --->');
                
                if (htmlStart !== -1 && htmlEnd !== -1 && htmlEnd > htmlStart) {
                    generatedHtml = generatedContent.substring(htmlStart + 21, htmlEnd).trim();
                    generatedHtml = generatedHtml.replace(/```html\n?|```/g, '').trim();
                }
                
                // 如果解析失败，使用备用方案
                if (!generatedMarkdown || !generatedHtml) {
                    // 尝试从整个内容中提取纯文本作为markdown
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = generatedContent;
                    generatedMarkdown = tempDiv.textContent || generatedContent;
                    
                    // 清理markdown内容
                    generatedMarkdown = generatedMarkdown
                        .replace(/<--- MARKDOWN_START --->.*?<--- MARKDOWN_END --->/gs, '')
                        .replace(/<--- HTML_START --->.*?<--- HTML_END --->/gs, '')
                        .replace(/```html\n?|```markdown\n?|```/g, '')
                        .trim();
                    
                    // 使用原始内容作为HTML
                    generatedHtml = generatedContent
                        .replace(/```html\n?|```/g, '')
                        .trim();
                }
                
                // 验证和修复Markdown格式
                generatedMarkdown = validateAndFixMarkdownFormat(generatedMarkdown);
                
                // 填充到对应模块
                markdownContent.value = generatedMarkdown;
                outputHtml.value = generatedHtml;
                
                // 基础预览
                const fullHtml = '<!DOCTYPE html>' + 
                    '<html>' +
                    '<head>' +
                    '    <meta charset="UTF-8">' +
                    '    <meta name="viewport" content="width=device-width, initial-scale=1.0">' +
                    '    <title>Preview</title>' +
                    '    <style>' +
                    '        body {' +
                    '            margin: 0 auto; ' +
                    '            max-width: 680px; ' +
                    '            padding: 20px;' +
                    '            box-sizing: border-box;' +
                    '            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;' +
                    '            line-height: 1.7; ' +
                    '            background-color: white;' +
                    '        }' +
                    '    </style>' +
                    '</head>' +
                    '<body>' +
                    generatedHtml +
                    '</body>' +
                    '</html>';
                previewFrame.srcdoc = fullHtml;

            } catch (error) {
                console.error("API 调用失败:", error);
                outputHtml.value = "双格式内容生成失败，请检查网络或 API Key 配置。\n错误信息: " + error.message;
                markdownContent.value = "Markdown 生成失败: " + error.message;
                previewFrame.srcdoc = '<div style="padding: 20px; color: red;">生成失败: ' + error.message + '</div>';
            } finally {
                convertBtn.disabled = false;
                buttonText.innerHTML = 'AI 转换为双格式内容';
            }
        }

        convertBtn.addEventListener('click', convertToHtml);

        // 复制功能实现
        function copyToClipboard(text, button) {
            // 创建临时textarea元素
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    // 显示复制成功状态
                    const originalText = button.innerHTML;
                    button.classList.add('copied');
                    button.disabled = true;
                    
                    setTimeout(() => {
                        button.classList.remove('copied');
                        button.disabled = false;
                        button.innerHTML = originalText;
                    }, 2000);
                }
            } catch (err) {
                console.error('复制失败:', err);
                alert('复制失败，请手动选择文本后复制');
            }
            
            document.body.removeChild(textarea);
        }

        // 复制Markdown内容
        document.getElementById('copyMarkdownBtn').addEventListener('click', () => {
            const markdownText = markdownContent.value;
            if (!markdownText.trim()) {
                alert('Markdown内容为空，请先生成内容');
                return;
            }
            copyToClipboard(markdownText, document.getElementById('copyMarkdownBtn'));
        });

        // 复制HTML内容
        document.getElementById('copyHtmlBtn').addEventListener('click', () => {
            const htmlText = outputHtml.value;
            if (!htmlText.trim()) {
                alert('HTML内容为空，请先生成内容');
                return;
            }
            copyToClipboard(htmlText, document.getElementById('copyHtmlBtn'));
        });

        // 复制预览内容（富文本格式）
        document.getElementById('copyPreviewBtn').addEventListener('click', () => {
            const iframe = document.getElementById('previewFrame');
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            
            if (!iframeDoc.body || !iframeDoc.body.innerHTML.trim()) {
                alert('预览内容为空，请先生成内容');
                return;
            }
            
            // 获取预览内容的HTML
            const previewHtml = iframeDoc.body.innerHTML;
            
            // 创建富文本格式的复制内容
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = previewHtml;
            
            // 使用现代Clipboard API复制富文本
            if (navigator.clipboard && window.ClipboardItem) {
                const blob = new Blob([previewHtml], { type: 'text/html' });
                const clipboardItem = new ClipboardItem({ 'text/html': blob });
                
                navigator.clipboard.write([clipboardItem]).then(() => {
                    const button = document.getElementById('copyPreviewBtn');
                    const originalText = button.innerHTML;
                    button.classList.add('copied');
                    button.disabled = true;
                    
                    setTimeout(() => {
                        button.classList.remove('copied');
                        button.disabled = false;
                        button.innerHTML = originalText;
                    }, 2000);
                }).catch(err => {
                    console.error('富文本复制失败:', err);
                    // 降级方案：复制纯文本
                    const plainText = tempDiv.textContent || tempDiv.innerText || '';
                    copyToClipboard(plainText, document.getElementById('copyPreviewBtn'));
                });
            } else {
                // 降级方案：复制纯文本
                const plainText = tempDiv.textContent || tempDiv.innerText || '';
                copyToClipboard(plainText, document.getElementById('copyPreviewBtn'));
            }
        });
        

        

        

    </script>
</body>
</html>
