<!DOCTYPE html>

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');

            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;

            padding: 20px;

            max-width: 1200px;

        textarea {
            resize: none;
        }
        
        #previewFrame {
            width: 100%;
            height: 100%;
            border: 1px solid #cbd5e1;
            background-color: white;
            border-radius: 0.5rem;
        }

            border: 4px solid #f3f3f3;

            border-radius: 50%;
            width: 24px;
            height: 24px;

        }

</head>
<body>

    <script>
        const apiKey = "sk-evnzwlkcztarigsagfktigefdzpqevgnggednvkgbbewsttn"; // 硅基流动API Key 

        const inputContent = document.getElementById('inputContent');
        const outputHtml = document.getElementById('outputHtml');

        // 🌐 AI公众号排版与内容专家（专业学术模板）
        const SYSTEM_INSTRUCTION = `🔷 核心使命与角色
你是一位精通学术论文和期刊排版的专家。核心职责是：根据用户输入和结构重塑规则，同时生成内容对应的 Markdown 结构文本和微信兼容 HTML 代码。

内容模式判断：

如果输入是简短话题或主题（少于 100 字）：进入内容创作模式（生成 800-1200 字文章）。

如果输入是完整但无结构的文章内容（超过 100 字且缺乏标题）：进入结构重塑模式，强制应用正式文章结构。

如果输入是结构完整的文章：进入排版优化模式（优化分段并应用样式）。

强制双格式输出：你的最终输出必须且只能包含两个部分，用指定的标记分隔。

📝 内容结构与专业学术规范
结构重塑强制规则（针对无标题/无结构文本）：
如果输入的文本缺乏结构：

自动生成主标题 (H1)：AI 必须根据文本核心主题，自动提炼并生成一个严谨、学术的 H1 级别文章标题。

强制分段：将内容拆解为以下正式结构：引言 (H2, 编号 1.)、核心论点/主体 (H2/H3, 编号 2.)、结论与展望 (H2, 下一序号)。

结构编号规则：在文章主体部分，对 H2 和 H3 级别的标题必须进行分级编号（例如：H2为 "1. XXXXX", H3为 "1.1 XXXX"）。

🎨 核心色彩规范
主色调 (Primary)：学术深蓝 #1E40AF。

背景色：纯白色 #FFFFFF，容器背景使用最浅灰 #F9FAFB。

📐 核心排版与组件执行
硬约束：所有样式必须写在 'style=""' 中，绝不使用 'class'、'id'、'<style>'。

标签优化：优先使用 <section> 和 <p> 作为容器。

样式规范：圆角 4px，模块分隔依赖垂直留白和细致的浅灰色分割线。

📢 最终输出格式（这是强制规则）
你的响应内容必须且仅包含以下结构。请将所有生成的 Markdown 和 HTML 内容分别放置在对应的标记块中。

<--- MARKDOWN_START --->

# [AI 自动生成/提炼的文章主标题]
> [引用样式的简短摘要或分享语]

## 1. [引言/背景 H2 标题]
... [对应的正文内容]

### 1.1 [H3 标题]
... [对应的正文内容]

## 2. [核心论点 H2 标题]
... [对应的正文内容]
<--- MARKDOWN_END --->

<--- HTML_START --->
[完整的微信兼容 HTML 代码片段]
<--- HTML_END --->

**硬约束**：
1. 所有样式必须使用内联style属性实现，禁止使用class、id、<style>标签
2. 确保所有文本与背景的对比度符合WCAG AA标准
3. 输出必须是纯HTML代码，无任何JavaScript
4. 完全兼容微信公众号编辑器限制
5. 绝对禁止在输出内容中添加任何说明性文字、设计描述、技术说明等非内容文本

**文章底部固定内容**：
在文章正文结束后，添加以下固定模块（使用迷你卡片设计）：

1. **关注作者模块**：
   - 标题："关注作者"
   - 内容：欢迎关注"召哥AI笔记室"，获取更多学术研究干货
   - 样式：迷你卡片设计，背景 #F1F5F9，主色调按钮

2. **互动引导模块**：
   - 标题："学术交流"
   - 内容：点赞、在看、转发，支持学术知识传播
   - 样式：迷你卡片设计，背景 #F1F5F9，辅助色按钮

3. **打赏支持模块**：
   - 标题："支持研究"
   - 内容：如果觉得文章有帮助，欢迎支持学术研究
   - 样式：迷你卡片设计，背景 #F1F5F9，主色调按钮

4. **学术资源模块**：
   - 标题："学术资源"
   - 内容：获取更多学术研究资料和工具
   - 样式：迷你卡片设计，背景 #F1F5F9，辅助色按钮
`;

        // Markdown格式验证和修复函数
        function validateAndFixMarkdownFormat(markdownText) {
            if (!markdownText) return markdownText;
            
            let fixedMarkdown = markdownText;
            
            // 1. 确保标题有正确的#标记
            // 修复H1标题（主标题）
            fixedMarkdown = fixedMarkdown.replace(/^(?!\s*#)(.+)$/gm, (match, title) => {
                // 如果是主标题且没有#标记，添加#
                if (title.trim() && !title.includes('##') && !title.includes('###')) {
                    return `# ${title.trim()}`;
                }
                return match;
            });
            
            // 2. 修复H2标题（二级标题）
            fixedMarkdown = fixedMarkdown.replace(/^(\d+\.\s+.+)$/gm, '## $1');
            
            // 3. 修复H3标题（三级标题）
            fixedMarkdown = fixedMarkdown.replace(/^(\d+\.\d+\s+.+)$/gm, '### $1');
            
            // 4. 确保引用块有>标记
            fixedMarkdown = fixedMarkdown.replace(/^\s*(>.+)$/gm, '> $1');
            
            // 5. 添加段落分隔（确保段落之间有换行）
            fixedMarkdown = fixedMarkdown.replace(/([^\n])\n([^#\n>])/g, '$1\n\n$2');
            
            // 6. 修复列表格式
            fixedMarkdown = fixedMarkdown.replace(/^\s*[-*]\s+(.+)$/gm, '- $1');
            
            // 7. 确保代码块格式正确
            fixedMarkdown = fixedMarkdown.replace(/```(\w+)?\n([\s\S]*?)```/g, '```$1\n$2\n```');
            
            // 8. 清理多余的空行
            fixedMarkdown = fixedMarkdown.replace(/\n{3,}/g, '\n\n');
            
            // 9. 确保Markdown结构完整
            const lines = fixedMarkdown.split('\n');
            let hasH1 = false;
            let hasH2 = false;
            
            for (let i = 0; i < lines.length; i++) {
                if (lines[i].startsWith('# ') && !lines[i].startsWith('##')) {
                    hasH1 = true;
                }
                if (lines[i].startsWith('## ')) {
                    hasH2 = true;
                }
            }
            
            // 如果没有标题结构，尝试重新组织
            if (!hasH1 && lines.length > 0) {
                const firstLine = lines[0].trim();
                if (firstLine && !firstLine.startsWith('#') && !firstLine.startsWith('>')) {
                    lines[0] = `# ${firstLine}`;
                    fixedMarkdown = lines.join('\n');
                }
            }
            
            return fixedMarkdown;
        }

        // 核心转换函数 - 强制双输出结构
        async function convertToHtml() {
            const userQuery = inputContent.value.trim();
            if (!userQuery) {
                alert("请输入内容后再进行转换。");
                return;
            }

            convertBtn.disabled = true;
            buttonText.innerHTML = '<div class="loading-ring"></div> AI 正在生成双格式内容...';
            outputHtml.value = '';
            markdownContent.value = '';
            previewFrame.srcdoc = '<div style="padding: 20px; color: #64748B;">AI 正在生成双格式内容...</div>';

            const apiUrl = "https://api.siliconflow.cn/v1/chat/completions";

            const payload = {
                model: "deepseek-ai/DeepSeek-R1",
                messages: [
                    {
                        role: "system",
                        content: SYSTEM_INSTRUCTION
                    },
                    {
                        role: "user", 
                        content: userQuery
                    }
                ],
                temperature: 0.7,
                max_tokens: 8192,
                stream: false
            };

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`API调用失败: ${response.status}`);
                }

                const result = await response.json();
                let generatedContent = result?.choices?.[0]?.message?.content || '生成失败，请检查 API 响应。';
                
                // 解析强制双输出结构
                let generatedMarkdown = '';
                let generatedHtml = '';
                
                // 提取 MARKDOWN 部分
                const markdownStart = generatedContent.indexOf('<--- MARKDOWN_START --->');
                const markdownEnd = generatedContent.indexOf('<--- MARKDOWN_END --->');
                
                if (markdownStart !== -1 && markdownEnd !== -1 && markdownEnd > markdownStart) {
                    generatedMarkdown = generatedContent.substring(markdownStart + 25, markdownEnd).trim();
                }
                
                // 提取 HTML 部分
                const htmlStart = generatedContent.indexOf('<--- HTML_START --->');
                const htmlEnd = generatedContent.indexOf('<--- HTML_END --->');
                
                if (htmlStart !== -1 && htmlEnd !== -1 && htmlEnd > htmlStart) {
                    generatedHtml = generatedContent.substring(htmlStart + 21, htmlEnd).trim();
                    generatedHtml = generatedHtml.replace(/```html\n?|```/g, '').trim();
                }
                
                // 如果解析失败，使用备用方案
                if (!generatedMarkdown || !generatedHtml) {
                    // 尝试从整个内容中提取纯文本作为markdown
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = generatedContent;
                    generatedMarkdown = tempDiv.textContent || generatedContent;
                    
                    // 清理markdown内容
                    generatedMarkdown = generatedMarkdown
                        .replace(/<--- MARKDOWN_START --->.*?<--- MARKDOWN_END --->/gs, '')
                        .replace(/<--- HTML_START --->.*?<--- HTML_END --->/gs, '')
                        .replace(/```html\n?|```markdown\n?|```/g, '')
                        .trim();
                    
                    // 使用原始内容作为HTML
                    generatedHtml = generatedContent
                        .replace(/```html\n?|```/g, '')
                        .trim();
                }
                
                // 验证和修复Markdown格式
                generatedMarkdown = validateAndFixMarkdownFormat(generatedMarkdown);
                
                // 填充到对应模块
                markdownContent.value = generatedMarkdown;
                outputHtml.value = generatedHtml;
                
                // 基础预览
                const fullHtml = '<!DOCTYPE html>' + 
                    '<html>' +
                    '<head>' +
                    '    <meta charset="UTF-8">' +
                    '    <meta name="viewport" content="width=device-width, initial-scale=1.0">' +
                    '    <title>Preview</title>' +
                    '    <style>' +
                    '        body {' +
                    '            margin: 0 auto; ' +
                    '            max-width: 680px; ' +
                    '            padding: 20px;' +
                    '            box-sizing: border-box;' +
                    '            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;' +
                    '            line-height: 1.7; ' +
                    '            background-color: white;' +
                    '        }' +
                    '    </style>' +
                    '</head>' +
                    '<body>' +
                    generatedHtml +
                    '</body>' +
                    '</html>';
                previewFrame.srcdoc = fullHtml;

            } catch (error) {
                console.error("API 调用失败:", error);
                outputHtml.value = "排版生成失败，请检查网络或 API Key 配置。\n错误信息: " + error.message;
                markdownContent.value = "生成失败，请重试。";
                previewFrame.srcdoc = '<div style="padding: 20px; color: #EF4444;">生成失败，请检查网络连接或 API Key 配置。</div>';
            } finally {
                convertBtn.disabled = false;
                buttonText.textContent = 'AI转换';
            }
        }

        // 初始化预览区域
        previewFrame.srcdoc = '<div style="padding: 20px; color: #64748B; text-align: center;">等待AI转换生成内容...</div>';

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('专业学术模板已加载完成');
        });

        function showTemporaryMessage(message, color) {
            const tempSpan = document.createElement('span');
            tempSpan.textContent = message;
            // 修复语法错误：使用字符串拼接代替模板字符串
            tempSpan.className = 'text-' + color + '-600 font-semibold absolute top-0 right-0 p-2 bg-' + color + '-100 rounded-lg shadow-md';
            
            const container = document.querySelector('.container');
            container.style.position = 'relative';
            container.appendChild(tempSpan);

            setTimeout(() => {
                container.removeChild(tempSpan);
            }, 3000);
        }

        // Markdown到HTML的实时转换函数
        function markdownToHtml(markdown) {
            return markdown
                .replace(/^### (.*$)/gm, '<h3 style="color: #374151; font-weight: 500; font-size: 16px; margin: 20px 0 12px 0;">$1</h3>')
                .replace(/^## (.*$)/gm, '<h2 style="color: #374151; font-weight: 600; font-size: 18px; margin: 24px 0 16px 0;">$1</h2>')
                .replace(/^# (.*$)/gm, '<h1 style="color: #374151; font-weight: 600; font-size: 22px; text-align: left; margin-bottom: 8px;">$1</h1>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/`(.*?)`/g, '<code style="background: #F9FAFB; padding: 2px 4px; border-radius: 2px; font-family: monospace;">$1</code>')
                .replace(/^- (.*$)/gm, '<li style="margin: 8px 0; line-height: 1.7;">$1</li>')
                .replace(/^\d+\. (.*$)/gm, '<li style="margin: 8px 0; line-height: 1.7;">$1</li>')
                .replace(/\n\n/g, '</p><p style="line-height: 1.7; color: #1F2937; font-size: 16px; margin: 20px 0;">')
                .replace(/^>/gm, '<blockquote style="background: #F9FAFB; font-style: italic; padding: 16px 20px; margin: 16px 0;">')
                .replace(/\n/g, '<br>');
        }

        // 实时更新预览
        function updateRealTimePreview() {
            const markdownText = markdownContent.value || markdownContent.textContent || markdownContent.innerText;
            if (markdownText.trim()) {
                const htmlContent = markdownToHtml(markdownText);
                const fullHtml = '<!DOCTYPE html>' + 
                    '<html>' +
                    '<head>' +
                    '    <meta charset="UTF-8">' +
                    '    <meta name="viewport" content="width=device-width, initial-scale=1.0">' +
                    '    <title>Preview</title>' +
                    '    <style>' +
                    '        body {' +
                    '            margin: 0 auto; ' +
                    '            max-width: 680px; ' +
                    '            padding: 20px;' +
                    '            box-sizing: border-box;' +
                    '            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;' +
                    '            line-height: 1.7; ' +
                    '            background-color: white;' +
                    '        }' +
                    '        p { line-height: 1.7; color: #1F2937; font-size: 16px; margin: 20px 0; }' +
                    '        h1 { color: #374151; font-weight: 600; font-size: 22px; text-align: left; margin-bottom: 8px; }' +
                    '        h2 { color: #374151; font-weight: 600; font-size: 18px; margin: 24px 0 16px 0; }' +
                    '        h3 { color: #A16207; font-weight: 500; font-size: 16px; margin: 20px 0 12px 0; }' +
                    '        blockquote { background: #F9FAFB; font-style: italic; padding: 16px 20px; margin: 16px 0; }' +
                    '        ul, ol { margin-left: 24px; line-height: 1.7; }' +
                    '    </style>' +
                    '</head>' +
                    '<body>' +
                    htmlContent +
                    '</body>' +
                    '</html>';
                previewFrame.srcdoc = fullHtml;
                outputHtml.value = htmlContent;
            } else {
                // 如果没有内容，显示默认提示
                previewFrame.srcdoc = '<div style="padding: 20px; color: #64748B; text-align: center;">请在左侧输入内容并点击AI转换按钮生成排版</div>';
            }
        }
        
        // 初始化预览区域
        function initializePreview() {
            previewFrame.srcdoc = '<div style="padding: 20px; color: #64748B; text-align: center;">请在左侧输入内容并点击AI转换按钮生成排版</div>';
        }
        
        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            initializePreview();
            
            // 防止iframe滚动事件冒泡
            previewFrame.addEventListener('load', function() {
                const iframeDoc = previewFrame.contentDocument || previewFrame.contentWindow.document;
                iframeDoc.addEventListener('wheel', function(e) {
                    e.stopPropagation();
                }, { passive: false });
                
                iframeDoc.addEventListener('scroll', function(e) {
                    e.stopPropagation();
                }, { passive: false });
            });
        });

        // 事件监听器
        convertBtn.addEventListener('click', convertToHtml);
        
        // Markdown编辑区实时联动
        markdownContent.addEventListener('input', () => {
            debounce(updateRealTimePreview, 300);
        });

        // 复制按钮事件监听器
        copyMarkdownBtn.addEventListener('click', () => {
            const content = markdownContent.value || markdownContent.textContent || markdownContent.innerText;
            copyToClipboard(content, copyMarkdownBtn);
        });

        copyHtmlBtn.addEventListener('click', () => {
            const content = outputHtml.value || outputHtml.textContent || outputHtml.innerText;
            copyToClipboard(content, copyHtmlBtn);
        });

        copyPreviewBtn.addEventListener('click', () => {
            try {
                const iframeDoc = previewFrame.contentDocument || previewFrame.contentWindow.document;
                // 只复制body内的内容，而不是整个文档
                const content = iframeDoc.body.innerHTML;
                copyToClipboard(content, copyPreviewBtn);
            } catch (error) {
                showTemporaryMessage('预览内容复制失败，请先完成转换', 'red');
            }
        });

        // 统一复制功能实现
        async function copyToClipboard(content, button) {
            try {
                if (!content.trim()) {
                    showTemporaryMessage('没有内容可复制', 'red');
                    return;
                }

                // 使用现代Clipboard API
                await navigator.clipboard.writeText(content);
                
                // 显示复制成功状态
                const originalText = button.textContent;
                button.textContent = '✓ 已复制';
                button.classList.add('bg-green-600');
                
                setTimeout(() => {
                    button.textContent = originalText;
                    button.classList.remove('bg-green-600');
                }, 2000);
                
            } catch (err) {
                console.error('复制失败:', err);
                // 降级方案
                try {
                    const textArea = document.createElement('textarea');
                    textArea.value = content;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    
                    // 显示复制成功状态
                    const originalText = button.textContent;
                    button.textContent = '✓ 已复制';
                    button.classList.add('bg-green-600');
                    setTimeout(() => {
                        button.textContent = originalText;
                        button.classList.remove('bg-green-600');
                    }, 2000);
                } catch (fallbackErr) {
                    showTemporaryMessage('复制失败，请手动选择内容复制', 'red');
                }
            }
        }
        
        // 创建微信公众号兼容的HTML内容
        function createWeChatCompatibleHtml(htmlContent) {

            const markdownText = markdownContent.value;

                return htmlContent;
            }
            
            // 重新生成包含完整内联样式的HTML
            const styledHtml = markdownToHtml(markdownText);
            
            // 构建微信公众号兼容的完整HTML结构
            const wechatHtml = `

                    ${styledHtml}
                    
                    <!-- 文章底部固定内容 -->
                    <div style="margin-top: 40px; padding: 20px; background-color: #f8f9fa; border-radius: 8px; border-left: 4px solid #374151;">

                        <h4 style="color: #28a745; font-size: 18px; margin-bottom: 10px;">打赏支持</h4>
                        <p style="margin: 0; color: #666;">如果觉得文章有帮助，欢迎打赏支持</p>
                    </div>
                    
                    <div style="margin-top: 20px; padding: 20px; background-color: #e2e3e5; border-radius: 8px; border-left: 4px solid #6c757d;">
                        <h4 style="color: #6c757d; font-size: 18px; margin-bottom: 10px;">公众号链接</h4>
                        <p style="margin: 0; color: #666;">点击访问"召哥AI笔记室"公众号主页</p>
                    </div>
                </div>
            `;
            
            return wechatHtml;
        }
    </script>
